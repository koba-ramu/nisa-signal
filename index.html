<title>NISAシグナル</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Zen+Kaku+Gothic+New:wght@400;500;700&family=IBM+Plex+Mono:wght@500;600&display=swap">
<style>
/* Layout: one narrow column like a pocket ledger; status by colored pills; fixed tab bar at the bottom.
   Japanese market convention: rising/buy = red, falling/sell = green. */
:root{
  --bg:#F2F4F7; --surface:#FFFFFF; --ink:#152030; --muted:#5B6677; --line:#DADFE7;
  --accent:#3A3F8F; --accent-soft:#E7E8F6; --on-accent:#FFFFFF;
  --buy:#BF332C; --buy-soft:#FBE8E6; --sell:#1B7A61; --sell-soft:#E2F2EC;
  --hold:#626B78; --hold-soft:#ECEEF1; --warn:#9E5E00; --warn-soft:#FCF0DA;
  --f-body:"Zen Kaku Gothic New","Hiragino Sans","Noto Sans JP",system-ui,sans-serif;
  --f-num:"IBM Plex Mono",ui-monospace,"SFMono-Regular",Menlo,monospace;
  --r:12px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0E131A; --surface:#17202B; --ink:#E6EBF2; --muted:#98A3B3; --line:#2A3441;
  --accent:#A3A8F2; --accent-soft:#262B4F; --on-accent:#10142E;
  --buy:#F07C73; --buy-soft:#3A1F1D; --sell:#5DC8A5; --sell-soft:#15322A;
  --hold:#A6AEBB; --hold-soft:#252C37; --warn:#EEB458; --warn-soft:#382B12; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0E131A; --surface:#17202B; --ink:#E6EBF2; --muted:#98A3B3; --line:#2A3441;
  --accent:#A3A8F2; --accent-soft:#262B4F; --on-accent:#10142E;
  --buy:#F07C73; --buy-soft:#3A1F1D; --sell:#5DC8A5; --sell-soft:#15322A;
  --hold:#A6AEBB; --hold-soft:#252C37; --warn:#EEB458; --warn-soft:#382B12; color-scheme:dark}

*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.6}
.app{max-width:640px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:16px calc(96px + env(safe-area-inset-bottom,0px));display:grid;gap:16px}
h1,h2,h3{margin:0;text-wrap:balance}
h1{font-size:22px;font-weight:700;letter-spacing:.02em}
h2{font-size:16px;font-weight:700}
p{margin:0}
.num{font-family:var(--f-num);font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}
.small{font-size:13px}
.top{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;flex-wrap:wrap}
.top .date{font-size:13px;color:var(--muted)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;display:grid;gap:12px;min-width:0}
.card-head{display:flex;justify-content:space-between;align-items:baseline;gap:8px;flex-wrap:wrap}
.label{font-size:12px;color:var(--muted);letter-spacing:.06em}
.banner{border-radius:var(--r);padding:12px 14px;font-size:14px;display:grid;gap:8px}
.banner.sample{background:var(--accent-soft);color:var(--ink)}
.banner.warn{background:var(--warn-soft);color:var(--ink);border-left:4px solid var(--warn)}

/* style switch */
.seg{display:inline-flex;background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:3px;gap:2px}
.seg button{border:0;background:transparent;color:var(--muted);font:inherit;font-size:14px;font-weight:500;padding:6px 14px;border-radius:999px;cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--on-accent)}

/* meters */
.meter{display:grid;gap:4px}
.meter-top{display:flex;justify-content:space-between;gap:8px;font-size:14px;flex-wrap:wrap}
.bar{height:8px;border-radius:99px;background:var(--hold-soft);overflow:hidden}
.bar i{display:block;height:100%;background:var(--accent);border-radius:99px}
.bar i.full{background:var(--warn)}

/* pills */
.pill{display:inline-flex;align-items:center;gap:4px;font-size:13px;font-weight:700;padding:3px 10px;border-radius:999px;white-space:nowrap}
.pill.buy{background:var(--buy-soft);color:var(--buy)}
.pill.sell{background:var(--sell-soft);color:var(--sell)}
.pill.hold{background:var(--hold-soft);color:var(--hold)}
.pill.none{background:transparent;color:var(--muted);border:1px dashed var(--line)}
.pill.warn{background:var(--warn-soft);color:var(--warn)}
.chip{font-size:11px;padding:1px 7px;border-radius:6px;background:var(--hold-soft);color:var(--muted);white-space:nowrap}

/* lists */
.list{display:grid;gap:10px}
.row{display:flex;justify-content:space-between;align-items:center;gap:10px;min-width:0}
.row > div{min-width:0}
.inst{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px;display:grid;gap:10px}
.inst-name{font-weight:700}
.inst-code{font-family:var(--f-num);font-size:12px;color:var(--muted);margin-left:6px}
.inst-meta{display:flex;gap:6px;align-items:center;flex-wrap:wrap;font-size:12px;color:var(--muted)}
.price-line{display:flex;align-items:center;gap:8px;flex-wrap:wrap;font-size:13px;color:var(--muted)}
.price-line input{width:120px}
.hold-line{font-size:13px;display:flex;gap:12px;flex-wrap:wrap}
.up{color:var(--buy)} .down{color:var(--sell)}
details{border-top:1px solid var(--line);padding-top:8px}
summary{cursor:pointer;font-size:13px;color:var(--accent);font-weight:500}
.why{display:grid;gap:6px;margin-top:8px;font-size:13px}
.why-grid{display:grid;grid-template-columns:auto 1fr;gap:2px 12px}
.why ul{margin:0;padding-left:18px}
.group-title{font-size:13px;color:var(--muted);letter-spacing:.06em;margin-top:4px}

/* forms */
.form{display:grid;gap:12px}
.field{display:grid;gap:4px;min-width:0}
.field label{font-size:13px;color:var(--muted)}
.field .hint{font-size:12px;color:var(--muted)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media (max-width:420px){.grid2{grid-template-columns:1fr}}
input,select{font:inherit;font-size:16px;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:8px 10px;width:100%;min-width:0}
input:focus-visible,select:focus-visible,button:focus-visible,summary:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.radio{display:flex;gap:8px}
.radio label{flex:1;text-align:center;border:1px solid var(--line);border-radius:8px;padding:8px;cursor:pointer;font-weight:500;color:var(--muted)}
.radio input{position:absolute;opacity:0;width:1px;height:1px}
.radio input:checked + span{color:var(--ink)}
.radio label:has(input:checked){border-color:var(--accent);background:var(--accent-soft);color:var(--ink)}
.btn{font:inherit;font-weight:700;font-size:15px;border:0;border-radius:10px;padding:11px 16px;cursor:pointer;background:var(--accent);color:var(--on-accent)}
.btn.ghost{background:transparent;color:var(--accent);border:1px solid var(--line)}
.btn.danger{background:var(--buy);color:#fff}
.btn.small{font-size:13px;padding:6px 10px;font-weight:500}
.link{background:none;border:0;padding:0;font:inherit;font-size:13px;color:var(--muted);text-decoration:underline;cursor:pointer}
.empty{text-align:center;color:var(--muted);font-size:14px;padding:20px 8px}

/* tab bar */
.tabs{position:fixed;left:0;right:0;bottom:0;background:var(--surface);border-top:1px solid var(--line);display:flex;justify-content:center;padding-bottom:env(safe-area-inset-bottom,0px);padding-left:max(8px,env(safe-area-inset-left,0px));padding-right:max(8px,env(safe-area-inset-right,0px));z-index:5}
.tabs-inner{display:grid;grid-template-columns:repeat(5,1fr);width:100%;max-width:640px}
/* ranking */
.rank{display:grid;grid-template-columns:28px 1fr;gap:10px;align-items:start;padding-bottom:10px;border-bottom:1px solid var(--line)}
.rank:last-child{border-bottom:0;padding-bottom:0}
.rank-n{font-size:18px;font-weight:600;color:var(--muted);text-align:center;line-height:1.5}
.rank:nth-child(-n+3) .rank-n{color:var(--accent)}
.rank-body{display:grid;gap:4px;min-width:0}
.inst-rank{font-family:var(--f-num);font-weight:600;color:var(--accent);margin-right:6px}
.idx{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
@media (max-width:520px){.idx{grid-template-columns:1fr 1fr}}
/* price chart */
.chart{margin:4px 0 0;display:grid;gap:4px}
.chart-head{display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap;align-items:baseline}
.chart-legend{display:flex;gap:12px;flex-wrap:wrap;color:var(--muted)}
.lg{display:inline-block;width:14px;height:0;border-top:2px solid;vertical-align:middle;margin-right:4px}
.lg-p{border-color:var(--ink)} .lg-25{border-color:var(--accent)} .lg-75{border-color:var(--muted);border-top-style:dashed}
.chart svg{width:100%;height:140px;display:block;touch-action:pan-y}
.chart .grid{stroke:var(--line);stroke-width:1;vector-effect:non-scaling-stroke}
.chart .ln-p{stroke:var(--ink);stroke-width:2;vector-effect:non-scaling-stroke;stroke-linejoin:round}
.chart .ln-25{stroke:var(--accent);stroke-width:2;vector-effect:non-scaling-stroke}
.chart .ln-75{stroke:var(--muted);stroke-width:2;stroke-dasharray:4 3;vector-effect:non-scaling-stroke}
.chart .dot{fill:var(--ink);stroke:var(--surface);stroke-width:2}
.chart .cross{stroke:var(--muted);stroke-width:1;vector-effect:non-scaling-stroke}
.chart-axis{display:flex;justify-content:space-between}
/* factor bars */
.fxs{display:grid;gap:8px}
.fx{display:grid;grid-template-columns:minmax(0,8.5em) 1fr 3.2em;gap:4px 8px;align-items:center}
.fx-l{font-size:13px}
.fx-bar{position:relative;height:6px;background:var(--hold-soft);border-radius:99px}
.fx-bar::after{content:"";position:absolute;left:50%;top:-3px;bottom:-3px;width:1px;background:var(--muted);opacity:.5}
.fx-bar i{position:absolute;top:0;bottom:0;border-radius:99px;background:var(--accent)}
.fx-bar i.neg{background:var(--warn)}
.fx-v{font-size:12px;text-align:right}
.fx-why{grid-column:1/-1;font-size:12px;color:var(--muted);margin-top:-2px}
/* review checklist */
.checks{display:grid;gap:6px;font-size:13px;margin:0;padding:0;list-style:none}
.checks li{display:grid;grid-template-columns:20px 1fr;gap:6px;align-items:start}
.checks .ok{color:var(--sell);font-weight:700}
.checks .ng{color:var(--warn);font-weight:700}
.checks input[type=checkbox]{width:16px;height:16px;margin:3px 0 0;accent-color:var(--accent)}
textarea{font:inherit;font-size:16px;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:8px 10px;width:100%;min-height:72px;resize:vertical}
.tabs button{border:0;background:none;font:inherit;font-size:12px;color:var(--muted);padding:10px 4px 12px;cursor:pointer;display:grid;justify-items:center;gap:2px}
.tabs button svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.8}
.tabs button[aria-current="page"]{color:var(--accent);font-weight:700}

/* sheet & toast */
.sheet{position:fixed;inset:0;background:rgba(10,14,20,.45);display:flex;align-items:flex-end;justify-content:center;z-index:20}
.sheet-body{background:var(--surface);color:var(--ink);width:100%;max-width:640px;border-radius:16px 16px 0 0;padding:20px max(16px,env(safe-area-inset-right,0px)) calc(20px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));display:grid;gap:12px;max-height:85vh;overflow:auto}
.sheet-actions{display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(80px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:8px 16px;border-radius:999px;font-size:14px;z-index:30}
@media (prefers-reduced-motion:no-preference){.sheet-body{animation:up .18s ease-out}@keyframes up{from{transform:translateY(24px);opacity:.6}to{transform:none;opacity:1}}}
</style>

<div class="app">
  <header class="top">
    <div>
      <h1>NISAシグナル</h1>

</div>

<script>
(function(){
'use strict';
const KEY='nisa-signal-v1';
const LIMITS={tsumitate:1200000,growth:2400000,lifetime:18000000,growthLifetime:12000000};
const NOW=new Date();
const Y=NOW.getFullYear();
const pad=n=>String(n).padStart(2,'0');
const todayStr=()=>`${Y}-${pad(NOW.getMonth()+1)}-${pad(NOW.getDate())}`;
const monthStr=()=>todayStr().slice(0,7);
const STYLES={short:{label:'短期',tw:.6,aw:.4,ai:'短期への影響'},mid:{label:'中期',tw:.5,aw:.5,ai:'短期と中長期の平均'},long:{label:'長期',tw:.3,aw:.7,ai:'中長期への影響'}};
const MARKET={us:'米国株',jp:'日本株',fund:'投資信託'};
const FRAME={tsumitate:'つみたて投資枠',growth:'成長投資枠'};
const KIND={buy:'買い検討',hold:'様子見',sell:'売り検討'};
const DEF={capital:3000000,planTsumitate:1200000,planGrowth:1800000,monthlyLimit:2,buyMin:50000,buyMax:300000,stopLoss:10,takeProfit:20,priorLifetime:0,usdjpy:150,style:'mid'};

/* Sample judgement values (stage 1 only). Replaced by real calculation in stage 3 and Gemini in stage 4. */
function defaultInstruments(){
  const S=(t,a,extra)=>Object.assign({sample:true,tech:{short:t[0],mid:t[1],long:t[2]},ai:{short:a[0],long:a[1],conf:a[2]}},extra||{});
  const list=[
    {id:'NVDA',name:'NVIDIA',code:'NVDA',market:'us',sector:'AI向けGPU',sig:S([1,1,1],[1,2,'高'],{overheated:true,reason:'例: データセンター向けの需要が強いという記事が多い、という想定。'})},
    {id:'AVGO',name:'Broadcom',code:'AVGO',market:'us',sector:'カスタム半導体・通信',sig:S([0,1,1],[1,1,'中'],{reason:'例: AI向けの受注が続いている、という想定。'})},
    {id:'TSM',name:'TSMC',code:'TSM',market:'us',sector:'受託製造',sig:S([-1,0,1],[0,1,'中'],{reason:'例: 短期は地政学の話題で弱いが、中長期の需要は堅い、という想定。'})},
    {id:'AMD',name:'AMD',code:'AMD',market:'us',sector:'GPU・CPU',sig:S([1,0,-1],[-1,0,'低'],{reason:'例: 競争が激しいという記事と、新製品の期待が混在、という想定。'})},
    {id:'MU',name:'Micron Technology',code:'MU',market:'us',sector:'メモリ(HBM)',sig:S([-2,-1,0],[-1,0,'中'],{reason:'例: メモリ価格の下落を心配する記事が増えた、という想定。'})},
    {id:'ASML',name:'ASML',code:'ASML',market:'us',sector:'露光装置',sig:S([0,0,1],[0,1,'中'],{reason:'例: 大きなニュースはなく、中長期の見通しは変わらない、という想定。'})},
    {id:'8035',name:'東京エレクトロン',code:'8035',market:'jp',sector:'製造装置',sig:S([2,1,0],[1,1,'高'],{reason:'例: 前夜のSOX指数の上昇につられやすい、という想定。'})},
    {id:'6857',name:'アドバンテスト',code:'6857',market:'jp',sector:'検査装置',sig:S([1,2,1],[2,1,'高'],{overheated:true,reason:'例: AI半導体の検査需要が強い、という想定。'})},
    {id:'6920',name:'レーザーテック',code:'6920',market:'jp',sector:'マスク検査装置',sig:S([-1,-2,-1],[-2,-1,'中'],{severe:true,reason:'例: 業績予想を大きく下方修正した、という想定。'})},
    {id:'6146',name:'ディスコ',code:'6146',market:'jp',sector:'切断・研削装置',sig:S([0,1,1],[0,1,'中'],{reason:'例: 目立った材料はない、という想定。'})},
    {id:'7735',name:'SCREENホールディングス',code:'7735',market:'jp',sector:'洗浄装置',sig:S([-1,-1,0],[0,0,'中'],{reason:'例: 材料に乏しく、株価は横ばい、という想定。'})},
    {id:'6723',name:'ルネサスエレクトロニクス',code:'6723',market:'jp',sector:'車載半導体',sig:S([-1,-1,-1],[-1,-1,'中'],{reason:'例: 自動車向けの需要が弱い、という想定。'})},
    {id:'4063',name:'信越化学工業',code:'4063',market:'jp',sector:'シリコンウエハー',sig:S([0,0,1],[0,1,'高'],{reason:'例: 財務が強く、長期では安定、という想定。'})},
    {id:'ACWI',name:'eMAXIS Slim 全世界株式(オール・カントリー)',code:'オルカン',market:'fund',sector:'全世界株式',sig:S([0,0,1],[0,1,'中'],{reason:'例: 高値からの下落は小さく、積立を続ける時期、という想定。'})},
    {id:'SP500',name:'eMAXIS Slim 米国株式(S&P500)',code:'S&P500',market:'fund',sector:'米国株式',sig:S([0,0,2],[0,1,'中'],{reason:'例: 高値から10%以上下がった、という想定(追加購入の検討どき)。'})}
  ];
  list.forEach(i=>{if(i.sig)i.sig.m=sampleMetrics(i.id);});
  return list;
}
/* Sample metrics (stage 1 only; replaced by real data in stage 2-3).
   vol=1年の値動き(年率%) r1m/r3m/r1y=騰落率% volx=出来高の倍率 liq=1日の売買代金(億円) earn=決算までの日数 buzz=ニュース話題度(-1〜1)
   epsg=予想増益率% ma200=200日線からの乖離% per pbr roe=% eq=自己資本比率% div=配当利回り% dd=52週高値からの下落%
   投信: fee=信託報酬% aum=純資産(億円) spread=分散の広さ(0〜1) */
const SM_KEYS=['vol','r1m','r3m','r1y','volx','liq','earn','buzz','epsg','ma200','per','pbr','roe','eq','div','dd'];
const SAMPLE_METRICS={
  NVDA:[50,4,10,35,1.3,50000,15,1,40,15,45,30,80,70,0,-8],
  AVGO:[45,6,15,40,1.4,15000,30,.5,30,20,35,12,30,40,1.2,-5],
  TSM:[38,-3,5,30,1.0,8000,45,.5,25,10,22,6,28,65,1.5,-10],
  AMD:[55,8,-5,10,1.6,12000,5,.5,20,-3,40,4,8,75,0,-25],
  MU:[55,-8,-12,-5,1.2,4000,40,-.5,-10,-12,15,2.5,10,65,.3,-30],
  ASML:[40,0,2,5,0.9,3000,60,0,10,2,30,14,45,40,1.0,-15],
  '8035':[45,7,8,15,1.5,1500,10,1,15,5,22,6,28,70,2.0,-18],
  '6857':[60,12,30,60,1.8,1200,50,1,35,35,35,10,30,60,.5,-3],
  '6920':[65,-15,-30,-40,2.0,600,70,-1,-20,-35,18,5,25,55,1.5,-55],

function ledger(){
  const trades=[...state.trades].sort((a,b)=>a.date.localeCompare(b.date)||String(a.id).localeCompare(String(b.id)));
  const pos={};const annual={tsumitate:0,growth:0};
  let buysAll=0,buysGrowth=0,soldPrev=0,soldPrevGrowth=0,soldThis=0;
  for(const t of trades){
    const k=t.inst+'|'+t.frame;const p=pos[k]||(pos[k]={inst:t.inst,frame:t.frame,qty:0,cost:0});
    const yr=+t.date.slice(0,4);
    if(t.side==='buy'){
      p.qty+=t.qty;p.cost+=t.amount;buysAll+=t.amount;if(t.frame==='growth')buysGrowth+=t.amount;
      if(yr===Y)annual[t.frame]+=t.amount;
    }else{
      const avg=p.qty>0?p.cost/p.qty:0;const q=Math.min(t.qty,p.qty);const basis=avg*q;
      p.cost-=basis;p.qty-=q;
      if(yr<Y){soldPrev+=basis;if(t.frame==='growth')soldPrevGrowth+=basis;}else if(yr===Y)soldThis+=basis;
    }
  }
  return{
    pos:Object.values(pos).filter(p=>p.qty>1e-9),
    annual,
    lifetime:state.settings.priorLifetime+buysAll-soldPrev,
    growthLife:buysGrowth-soldPrevGrowth,
    revival:soldThis
  };
}

/* ---------- signal: technical + AI market view, weighted by style ---------- */
function computeSignal(inst,styleKey){
  const a=autoOf(inst);
  if(a&&a.tech){
    /* 実データの判定: テクニカルは fetch_data.py が計算。AI市況判定(a.ai)は段階4から */
    const st=inst.market==='fund'?'long':styleKey;const W=STYLES[st];const t=a.tech[st];
    const tech=t.score;const A=a.ai||null;
    const ai=A?(st==='short'?A.short:st==='long'?A.long:(A.short+A.long)/2):null;
    const notes=[];let aw=A?W.aw:0;
    if(inst.market==='fund')notes.push('投資信託は、選んだスタイルに関係なく長期の基準で判定します。');
    if(!A)notes.push('AIの市況判定は段階4から加わります。いまは数値(テクニカル)だけで判定しています。');
    else if(A.conf==='低'){aw=aw/2;notes.push('AIの確信度が低いため、AIの比率を半分にしました。');}
    const tw=1-aw;const total=tech*tw+(ai||0)*aw;
    let kind=total>=0.8?'buy':total<=-0.8?'sell':'hold';
    const overheated=a.rsi14!=null&&a.rsi14>=70;
    if(A&&A.severe){kind='sell';notes.push('重大な悪材料があるため、数値に関係なく「売り検討・買い見送り」にしました。');}
    else if(A&&tech*ai<0){kind='hold';notes.push('数値とAIの判断が逆を向いているため「様子見」にしました。');}
    else if(kind==='buy'&&overheated){kind='hold';notes.push(`RSIが${a.rsi14}で買われすぎのため、「買い検討」にしていません。`);}
    if(inst.market==='fund'&&kind==='sell')kind='hold';
    return{kind,label:KIND[kind],tech,ai,tw,aw,total,notes,st,conf:A?A.conf:null,reason:A?A.reason:'',techWhy:t.why,sample:false};
  }
  const s=inst.sig;
  if(!s)return{kind:'none',label:'データ待ち',notes:['株価の自動取得(段階2)とシグナル計算(段階3)が終わると表示されます。']};
  const st=inst.market==='fund'?'long':styleKey;const W=STYLES[st];
  const tech=s.tech[st];
  const ai=st==='short'?s.ai.short:st==='long'?s.ai.long:(s.ai.short+s.ai.long)/2;
  const notes=[];let aw=W.aw;
  if(inst.market==='fund')notes.push('投資信託は、選んだスタイルに関係なく長期の基準で判定します。');
  if(s.ai.conf==='低'){aw=aw/2;notes.push('AIの確信度が低いため、AIの比率を半分にしました。');}
  const tw=1-aw;const total=tech*tw+ai*aw;
  let kind=total>=0.8?'buy':total<=-0.8?'sell':'hold';
  if(s.severe){kind='sell';notes.push('重大な悪材料があるため、数値に関係なく「売り検討・買い見送り」にしました。');}
  else if(tech*ai<0){kind='hold';notes.push('数値とAIの判断が逆を向いているため「様子見」にしました。');}
  else if(kind==='buy'&&s.overheated){kind='hold';notes.push('買われすぎのため、AIが好材料と判断しても「買い検討」にしていません。');}
  return{kind,label:KIND[kind],tech,ai,tw,aw,total,notes,st,conf:s.ai.conf,reason:s.reason,sample:s.sample};
}

/* lin: a→−1, b→+1 (直線、範囲外は±1で止める) */

function styleFit(inst,st){
  const m=metricsOf(inst);if(!m)return{f:0,factors:[],skipped:[]};
  if(inst.market==='fund'&&st!=='long')return{f:-.5,factors:[{label:'売買の向き不向き',w:1,s:-.5,why:'投資信託は値段が1日1回しか決まらず、短期・中期の売買には向かない'}],skipped:[],real:m.real};
  const key=inst.market==='fund'?'fund':st;const factors=[],skipped=[];
  FACTORS[key].forEach(([label,w,keys,fn])=>{
    if(keys.some(k=>m[k]==null)){skipped.push(label);return;}
    const res=fn(m,inst);factors.push({label,w,s:Math.round(res[0]*100)/100,why:res[1]});});
  const tw=factors.reduce((a,x)=>a+x.w,0);
  const f=tw>0?factors.reduce((a,x)=>a+x.w*x.s,0)/tw:0;
  return{f:Math.round(f*100)/100,factors,skipped,real:m.real};
}
const strengths=fit=>fit.factors.filter(x=>x.s>=.5).sort((a,b)=>b.s*b.w-a.s*a.w).slice(0,2);
const weaknesses=fit=>fit.factors.filter(x=>x.s<=-.5).sort((a,b)=>a.s*a.w-b.s*b.w).slice(0,1);

  const st=strengths(fit),wk=weaknesses(fit);
  return [st.length?'強み:'+st.map(x=>x.label).join('・'):'',wk.length?'注意:'+wk.map(x=>`${x.label}(${x.why})`).join(''):''].filter(Boolean).join(' / ');
}

/* 株価チャート(直近120営業日)。株価・25日線・75日線。指で触れると、その日の値を表示 */
function maSeries(c,n){return c.map((_,k)=>{if(k<n-1)return null;let s=0;for(let j=k-n+1;j<=k;j++)s+=c[j];return s/n;});}
let chartSeq=0;
function priceChart(a){
  const all=a.closes.filter(v=>v!=null);const N=Math.min(120,all.length);if(N<30)return'';
  const ma25=maSeries(all,25).slice(-N),ma75=maSeries(all,75).slice(-N),c=all.slice(-N);
  const vals=c.concat(ma25,ma75).filter(v=>v!=null);const lo=Math.min(...vals),hi=Math.max(...vals);
  const W=320,H=140,pl=4,pr=4,pt=8,pb=8;
  const x=k=>pl+(W-pl-pr)*k/(N-1),y=v=>pt+(H-pt-pb)*(1-(v-lo)/((hi-lo)||1));
  const path=s=>s.map((v,k)=>v==null?'':`${s[k-1]==null||k===0?'M':'L'}${x(k).toFixed(1)},${y(v).toFixed(1)}`).join('');
  const id='ch'+(++chartSeq);const fmtv=v=>Number(v).toLocaleString('ja-JP',{maximumFractionDigits:2});
  const data=JSON.stringify({c,ma25,ma75}).replace(/</g,'\\u003c');
  return `<figure class="chart" id="${id}" data-n="${N}" data-date="${esc(a.date)}"><figcaption class="chart-head"><span class="label">直近${N}営業日の株価</span><span class="chart-read num small" aria-live="polite">${fmtv(c[N-1])}(${mdDate(a.date)})</span></figcaption>
    <div class="chart-legend small"><span><i class="lg lg-p"></i>株価</span><span><i class="lg lg-25"></i>25日線</span><span><i class="lg lg-75"></i>75日線</span></div>
    <svg viewBox="0 0 ${W} ${H}" preserveAspectRatio="none" role="img" aria-label="株価と移動平均線のチャート">
      <line x1="0" x2="${W}" y1="${y(hi).toFixed(1)}" y2="${y(hi).toFixed(1)}" class="grid"/><line x1="0" x2="${W}" y1="${y(lo).toFixed(1)}" y2="${y(lo).toFixed(1)}" class="grid"/>
      <path d="${path(ma75)}" class="ln-75" fill="none"/><path d="${path(ma25)}" class="ln-25" fill="none"/><path d="${path(c)}" class="ln-p" fill="none"/>
      <circle cx="${x(N-1).toFixed(1)}" cy="${y(c[N-1]).toFixed(1)}" r="3" class="dot"/>
      <line class="cross" x1="0" x2="0" y1="0" y2="${H}" visibility="hidden"/>
      <rect class="hit" x="0" y="0" width="${W}" height="${H}" fill="transparent" data-chart="${id}" data-w="${W}" data-pl="${pl}" data-pr="${pr}"/>
    </svg>
    <div class="chart-axis small muted num"><span>高値 ${fmtv(hi)}</span><span>安値 ${fmtv(lo)}</span></div>
    <script type="application/json" class="chart-data">${data}<\/script></figure>`;
}
function chartHover(rect,ev){
  const fig=document.getElementById(rect.dataset.chart);if(!fig)return;
  const d=JSON.parse(fig.querySelector('.chart-data').textContent);const N=+fig.dataset.n;
  const box=rect.ownerSVGElement.getBoundingClientRect();const W=+rect.dataset.w,pl=+rect.dataset.pl,pr=+rect.dataset.pr;
  const px=(ev.clientX-box.left)/box.width*W;const k=Math.max(0,Math.min(N-1,Math.round((px-pl)/(W-pl-pr)*(N-1))));
  const xx=pl+(W-pl-pr)*k/(N-1);const cr=fig.querySelector('.cross');cr.setAttribute('x1',xx);cr.setAttribute('x2',xx);cr.setAttribute('visibility','visible');
  const f=v=>v==null?'—':Number(v).toLocaleString('ja-JP',{maximumFractionDigits:2});const back=N-1-k;
  fig.querySelector('.chart-read').textContent=`${back===0?mdDate(fig.dataset.date):back+'営業日前'}:株価 ${f(d.c[k])} ・ 25日線 ${f(d.ma25[k])} ・ 75日線 ${f(d.ma75[k])}`;
}

    return `<article class="inst">
      <div class="row"><div><span class="pill ${w.side==='buy'?'buy':'sell'}" style="font-size:11px;padding:1px 8px">${w.side==='buy'?'買い候補':'売り候補'}</span> <span class="inst-name">${esc(i.name)}</span></div><span class="pill ${r.kind}">${r.label}</span></div>
      <p class="small muted">${esc(w.addedAt)} に追加 ・ 確認 <b class="num" style="color:var(--ink)">${done}/${all}</b></p>
      <div class="field"><label for="wp-${esc(w.id)}">予定金額(円)</label><input class="num" id="wp-${esc(w.id)}" type="number" inputmode="numeric" min="0" step="1000" data-watch-plan="${esc(w.id)}" value="${w.plan||''}" placeholder="例: 100000"></div>
      <div class="field"><span class="label">自動チェック</span><ul class="checks">${auto.map(c=>`<li><span class="${c.ok?'ok':'ng'}" aria-label="${c.ok?'OK':'要確認'}">${c.ok?'✓':'!'}</span><span>${c.text}</span></li>`).join('')}</ul></div>
      <div class="field"><span class="label">自分で確認</span><ul class="checks">${man_.map(([k,t])=>`<li><input type="checkbox" id="wc-${esc(w.id)}-${k}" data-watch-check="${esc(w.id)}" data-k="${k}" ${w.checks[k]?'checked':''}><label for="wc-${esc(w.id)}-${k}">${t}</label></li>`).join('')}</ul></div>
      <div class="field"><label for="wm-${esc(w.id)}">メモ(なぜ売買するか・しないか)</label><textarea id="wm-${esc(w.id)}" data-watch-memo="${esc(w.id)}" placeholder="例: SOX指数が上がっているので短期で狙う。−8%で損切り">${esc(w.memo||'')}</textarea></div>
      <div class="row" style="justify-content:flex-start;flex-wrap:wrap">
        <button class="btn small" data-action="watch-go" data-id="${esc(w.id)}">${w.side==='buy'?'買う(売買記録へ)':'売る(売買記録へ)'}</button>
        <button class="btn ghost small" data-action="watch-skip" data-id="${esc(w.id)}">見送る</button>
        <button class="link" data-action="watch-del" data-id="${esc(w.id)}">リストから消す</button>
      </div></article>`;};
  const hist=closed.map(w=>{const i=instById(w.inst);return `<div class="row" style="border-bottom:1px solid var(--line);padding-bottom:8px"><div>
    <div><span class="chip">${w.status==='done'?(w.side==='buy'?'買った':'売った'):'見送った'}</span> <b>${esc(i?i.name:w.inst)}</b> <span class="small muted num">${esc(w.closedAt||'')}</span></div>
    ${w.memo?`<p class="small muted">${esc(w.memo)}</p>`:''}</div><button class="link" data-action="watch-del" data-id="${esc(w.id)}">消す</button></div>`;}).join('');
  return `<section class="card"><h2>検討の流れ</h2>
    <p class="small">① ホームや銘柄のランキングで気になった銘柄を「検討リストに入れる」 → ② ここで自動チェックと自分の確認を済ませる → ③ 買う・売るか、見送るかを決める</p>
    <p class="small muted">チェックが全部そろわなくても売買はできます。「!」の項目は、もう一度考える合図です。</p></section>
  ${open.length?`<div class="list">${open.map(card).join('')}</div>`:'<p class="empty">検討中の銘柄はありません。ホームのランキングから「検討リストに入れる」を押してください。</p>'}
  ${closed.length?`<section class="card"><h2>これまでの判断</h2><div class="list">${hist}</div><p class="small muted">見送った銘柄がその後どう動いたかは、段階4の成績表で振り返れるようにします。</p></section>`:''}`;
}
function field(id,label,val,hint,unit){
  return `<div class="field"><label for="s-${id}">${label}${unit?`(${unit})`:''}</label><input class="num" id="s-${id}" type="number" inputmode="decimal" step="any" min="0" data-set="${id}" value="${val}">${hint?`<span class="hint">${hint}</span>`:''}</div>`;
}
function viewSettings(){
  const s=state.settings;
  return `<section class="card"><h2>資金と計画</h2><div class="form">
    ${field('capital','投資資金の総額',s.capital,'','円')}
    <div class="grid2">${field('planTsumitate','つみたて投資枠の年間計画',s.planTsumitate,'上限 120万円','円')}${field('planGrowth','成長投資枠の年間計画',s.planGrowth,'上限 240万円','円')}</div>
    ${field('priorLifetime','去年までに使った生涯枠',s.priorLifetime,'2024年以降に買って、今も持っている分の取得額の合計','円')}
  </div></section>
  <section class="card"><h2>売買の条件</h2><div class="form">
    ${field('monthlyLimit','月の売買回数の上限',s.monthlyLimit,'超えそうになると警告します','回')}
    <div class="grid2">${field('buyMin','1回の購入額(下限)',s.buyMin,'','円')}${field('buyMax','1回の購入額(上限)',s.buyMax,'','円')}</div>
    <div class="grid2">${field('stopLoss','損切りライン',s.stopLoss,'この%下がったら知らせる','%')}${field('takeProfit','利益確定ライン',s.takeProfit,'この%上がったら知らせる','%')}</div>
  </div></section>
  <section class="card"><h2>為替</h2><div class="form">
    ${field('usdjpy','ドル円(予備)',s.usdjpy,MKT&&MKT.usdjpy?`いまは自動取得した ${MKT.usdjpy}円 を使っています。この欄は、自動取得できなかったときだけ使います`:'米国株の評価額の計算に使います','円')}
  </div></section>
  <section class="card"><h2>データ</h2>
    <p class="small muted">入力した内容は、このスマホ(ブラウザ)の中だけに保存されます。外部には送られません。</p>
    <div class="row" style="justify-content:flex-start;flex-wrap:wrap">
      ${state.sample?'<button class="btn small" data-action="clear-sample">サンプルを消す</button>':'<button class="btn ghost small" data-action="load-sample">サンプルを入れて試す</button>'}
      <button class="btn ghost small" data-action="reset">すべて初期化</button>
    </div>
  </section>
  <p class="small muted" style="text-align:center">表示は判断の材料です。売買の最終判断はご自身で行ってください。<br>データ:${MKT?esc(MKT.source):'未取得'}<br>試作品 v0.5(段階3)</p>`;
}

/* ---------- render ---------- */
const view=document.getElementById('view');
function render(){
  document.getElementById('today').textContent=NOW.toLocaleDateString('ja-JP',{year:'numeric',month:'long',day:'numeric',weekday:'short'});
  document.querySelectorAll('#styleSeg button').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.style===state.settings.style)));
  document.querySelectorAll('.tabs button').forEach(b=>{if(b.dataset.tab===tab)b.setAttribute('aria-current','page');else b.removeAttribute('aria-current');});
  view.innerHTML=tab==='home'?viewHome():tab==='stocks'?viewStocks():tab==='watch'?viewWatch():tab==='trades'?viewTrades():viewSettings();
  if(tab==='trades')bindTradeForm();
  if(tab==='stocks')bindAddInst();
}

/* ---------- sheet & toast ---------- */
const sheet=document.getElementById('sheet'),sheetBody=document.getElementById('sheetBody');
let sheetOk=null;
function openSheet(html,okLabel,onOk,danger,okDisabled){
  sheetOk=onOk;
  sheetBody.innerHTML=`${html}<div class="sheet-actions"><button class="btn ghost" data-action="sheet-cancel">${onOk?'やめる':'閉じる'}</button>${onOk&&!okDisabled?`<button class="btn ${danger?'danger':''}" data-action="sheet-ok">${okLabel}</button>`:''}</div>`;
  sheet.hidden=false;
  const f=sheetBody.querySelector('[data-action="sheet-ok"]')||sheetBody.querySelector('button');if(f)f.focus();
}
function closeSheet(){sheet.hidden=true;sheetOk=null;}
let toastTimer;
function toast(msg){const t=document.getElementById('toast');t.textContent=msg;t.hidden=false;clearTimeout(toastTimer);toastTimer=setTimeout(()=>{t.hidden=true},2200);}

/* ---------- trade validation ---------- */
function bindTradeForm(){
  const f=document.getElementById('tradeForm');if(!f)return;
  const instSel=f.querySelector('#t-inst'),hint=f.querySelector('#t-qty-hint'),frameSel=f.querySelector('#t-frame');
  const upd=()=>{const i=instById(instSel.value);hint.textContent=i&&i.market==='fund'?'口数(証券会社の表示どおり)':'株数';if(i&&i.market!=='fund')frameSel.value='growth';};
  const draft=tradeDraft;
  if(draft){
    f.querySelector(`input[name="side"][value="${draft.side}"]`).checked=true;
    instSel.value=draft.inst;
    const di=instById(draft.inst);if(di&&di.market==='fund')frameSel.value='tsumitate';
    if(draft.amount)f.querySelector('#t-amount').value=draft.amount;
  }
  instSel.addEventListener('change',upd);upd();
  if(draft&&instById(draft.inst)&&instById(draft.inst).market==='fund')frameSel.value='tsumitate';
  f.addEventListener('submit',e=>{e.preventDefault();
    const t={id:'t'+Date.now(),side:f.querySelector('input[name="side"]:checked').value,inst:instSel.value,frame:frameSel.value,date:f.querySelector('#t-date').value,amount:Math.round(+f.querySelector('#t-amount').value),qty:+f.querySelector('#t-qty').value};
    if(draft&&draft.watchId&&draft.inst===t.inst)t._watch=draft.watchId;
    reviewTrade(t);});
}
function reviewTrade(t){
  const s=state.settings;const i=instById(t.inst);const L=ledger();const errors=[],warns=[];
  if(!i)errors.push('銘柄を選んでください。');
  if(!(t.amount>0))errors.push('約定金額を入力してください。');
  if(!(t.qty>0))errors.push('数量を入力してください。');
  if(!t.date)errors.push('日付を入力してください。');
  const yr=+String(t.date).slice(0,4);
  const ym=String(t.date).slice(0,7);
  const monthCount=state.trades.filter(x=>x.date.slice(0,7)===ym).length;
  if(i&&t.side==='buy'){
    if(t.frame==='tsumitate'&&i.market!=='fund')errors.push('個別株は、つみたて投資枠では買えません。成長投資枠を選んでください。');
    if(yr===Y&&L.annual[t.frame]+t.amount>LIMITS[t.frame])errors.push(`${FRAME[t.frame]}の年間上限(${man(LIMITS[t.frame])})を超えます。残りは ${man(Math.max(0,LIMITS[t.frame]-L.annual[t.frame]))} です。`);
    if(L.lifetime+t.amount>LIMITS.lifetime)errors.push(`生涯の非課税枠(1,800万円)を超えます。残りは ${man(Math.max(0,LIMITS.lifetime-L.lifetime))} です。`);
    if(t.frame==='growth'&&L.growthLife+t.amount>LIMITS.growthLifetime)errors.push('成長投資枠の生涯上限(1,200万円)を超えます。');
    if(t.amount<s.buyMin||t.amount>s.buyMax)warns.push(`1回の購入額の目安(${yen(s.buyMin)}〜${yen(s.buyMax)})から外れています。`);
    const r=computeSignal(i,s.style);
    if(r.kind==='sell')warns.push(`この銘柄はいま「売り検討」の判定です(${STYLES[s.style].label}スタイル)。`);
  }
  let basisInfo='';
  if(i&&t.side==='sell'){
    const p=L.pos.find(p=>p.inst===t.inst&&p.frame===t.frame);
    if(!p||p.qty+1e-9<t.qty)errors.push(`${FRAME[t.frame]}で保有している数量(${p?p.qty.toLocaleString('ja-JP'):0}${qtyUnit(i)})を超えています。`);
    else{const basis=p.cost/p.qty*t.qty;const gain=t.amount-basis;
      basisInfo=`<div class="banner warn"><p><b>NISA枠についての注意</b><br>売っても、今年の枠は戻りません。取得額の <b class="num">${yen(basis)}</b> 分が、来年の1月に生涯枠へ戻ります。</p></div>
      <p class="small">この売却の${gain>=0?'利益':'損失'}:<b class="num ${gain>=0?'up':'down'}">${yen(gain)}</b>${gain>=0?`(課税口座なら約 ${yen(gain*0.20315)} の税金がかかるところ、NISAなので非課税)`:'(NISAの損失は、ほかの利益と相殺できません)'}</p>`;}
  }
  if(monthCount+1>s.monthlyLimit)warns.push(`${ym.replace('-','年')}月の売買が ${monthCount+1} 回目になり、月の上限(${s.monthlyLimit}回)を超えます。`);
  const sum=`<h2>${errors.length?'記録できません':'この内容で記録しますか?'}</h2>
    ${i?`<p><span class="pill ${t.side==='buy'?'buy':'sell'}">${t.side==='buy'?'買い':'売り'}</span> <b>${esc(i.name)}</b></p>
    <p class="small muted num">${esc(t.date)} ・ ${FRAME[t.frame]} ・ ${(t.qty||0).toLocaleString('ja-JP')}${qtyUnit(i)} ・ ${yen(t.amount||0)}</p>`:''}
    ${errors.length?`<ul class="small" style="color:var(--buy);margin:0;padding-left:18px">${errors.map(x=>`<li>${x}</li>`).join('')}</ul>`:''}
    ${!errors.length?basisInfo:''}
    ${!errors.length&&warns.length?`<ul class="small" style="color:var(--warn);margin:0;padding-left:18px">${warns.map(x=>`<li>${x}</li>`).join('')}</ul>`:''}`;
  openSheet(sum,'記録する',errors.length?null:()=>{
    const wid=t._watch;delete t._watch;state.trades.push(t);
    if(wid){const w=state.watch.find(x=>x.id===wid);if(w){w.status='done';w.closedAt=t.date;}}
    tradeDraft=null;save();closeSheet();render();toast(wid?'記録しました(検討リストも「済み」にしました)':'記録しました');},false);
}
function bindAddInst(){
  const f=document.getElementById('addInst');if(!f)return;
  f.addEventListener('submit',e=>{e.preventDefault();
    const name=f.querySelector('#ai-name').value.trim(),code=f.querySelector('#ai-code').value.trim();
    if(!name||!code)return;
    let id=code.toUpperCase();if(instById(id)){toast('その銘柄はすでに監視リストにあります');return;}
    state.instruments.push({id,name,code,market:f.querySelector('#ai-market').value,sector:f.querySelector('#ai-sector').value.trim(),price:null});
    save();render();toast(`${name} を追加しました`);});
}

/* ---------- events ---------- */
document.addEventListener('click',e=>{
  const st=e.target.closest('[data-style]');
  if(st){state.settings.style=st.dataset.style;save();render();toast(`${STYLES[st.dataset.style].label}スタイルの基準に切り替えました`);return;}
  const tb=e.target.closest('[data-tab]');
  if(tb){tab=tb.dataset.tab;tradeDraft=null;render();window.scrollTo(0,0);return;}
  const a=e.target.closest('[data-action]');if(!a)return;
  const act=a.dataset.action;
  if(act==='watch-add'){
    const i=instById(a.dataset.id);if(!i||openWatch(i.id))return;
    state.watch.push({id:'w'+Date.now(),inst:i.id,side:a.dataset.side==='sell'?'sell':'buy',addedAt:todayStr(),plan:a.dataset.side==='sell'?0:state.settings.buyMin,checks:{},memo:'',status:'open'});
    save();render();toast(`${i.name} を検討リストに入れました`);return;}
  if(act==='watch-go'){
    const w=state.watch.find(x=>x.id===a.dataset.id);if(!w)return;
    tradeDraft={side:w.side,inst:w.inst,amount:w.plan||'',watchId:w.id};tab='trades';render();window.scrollTo(0,0);return;}
  if(act==='watch-skip'){
    const w=state.watch.find(x=>x.id===a.dataset.id);if(!w)return;
    w.status='skip';w.closedAt=todayStr();save();render();toast('見送りました。メモは「これまでの判断」に残ります');return;}
  if(act==='watch-del'){
    const w=state.watch.find(x=>x.id===a.dataset.id);if(!w)return;
    openSheet('<h2>検討リストから消しますか?</h2><p class="small">メモも一緒に消えます。</p>','消す',()=>{state.watch=state.watch.filter(x=>x.id!==w.id);save();closeSheet();render();toast('消しました');},true);return;}
  if(act==='sheet-cancel'){closeSheet();return;}
  if(act==='sheet-ok'){if(sheetOk)sheetOk();return;}
  if(act==='clear-sample'){
    openSheet('<h2>サンプルを消しますか?</h2><p class="small">サンプルの売買記録と株価を消して、空の状態から始めます。監視銘柄と設定は残ります。</p>','消す',()=>{
      state.trades=state.trades.filter(t=>!t.sample);state.instruments.forEach(i=>{if(i.sig&&i.sig.sample)i.price=null;});state.sample=false;save();closeSheet();render();toast('サンプルを消しました');},true);return;}
  if(act==='load-sample'){
    if(state.trades.length){toast('売買記録があるときはサンプルを入れられません');return;}
    applySample(state);save();render();toast('サンプルを入れました');return;}
  if(act==='reset'){
    openSheet('<h2>すべて初期化しますか?</h2><p class="small">売買記録・株価・設定・追加した銘柄をすべて消して、最初の状態に戻します。元には戻せません。</p>','初期化する',()=>{
      state=freshState(false);save();closeSheet();render();toast('初期化しました');},true);return;}
  if(act==='del-inst'){
    const i=instById(a.dataset.id);if(!i)return;
    if(state.trades.some(t=>t.inst===i.id)){openSheet(`<h2>外せません</h2><p class="small">${esc(i.name)} には売買記録があるため、監視リストから外せません。先に売買記録を削除してください。</p>`,'',null);return;}
    openSheet(`<h2>${esc(i.name)} を監視リストから外しますか?</h2>`,'外す',()=>{state.instruments=state.instruments.filter(x=>x.id!==i.id);save();closeSheet();render();toast('外しました');},true);return;}
  if(act==='del-trade'){
    const t=state.trades.find(x=>x.id===a.dataset.id);if(!t)return;const i=instById(t.inst);
    openSheet(`<h2>この記録を削除しますか?</h2><p class="small num">${esc(t.date)} ・ ${t.side==='buy'?'買い':'売り'} ・ ${esc(i?i.name:t.inst)} ・ ${yen(t.amount)}</p>`,'削除する',()=>{state.trades=state.trades.filter(x=>x.id!==t.id);save();closeSheet();render();toast('削除しました');},true);return;}
});
document.addEventListener('change',e=>{
  const el=e.target;
  if(el.dataset.watchPlan){const w=state.watch.find(x=>x.id===el.dataset.watchPlan);if(!w)return;w.plan=Math.max(0,Math.round(+el.value||0));save();render();return;}
  if(el.dataset.watchCheck){const w=state.watch.find(x=>x.id===el.dataset.watchCheck);if(!w)return;w.checks[el.dataset.k]=el.checked;save();render();return;}
  if(el.dataset.watchMemo){const w=state.watch.find(x=>x.id===el.dataset.watchMemo);if(!w)return;w.memo=el.value;save();toast('メモを保存しました');return;}
  if(el.dataset.price){const i=instById(el.dataset.price);if(!i)return;i.price=el.value===''?null:+el.value;save();render();return;}
  if(el.dataset.set){const k=el.dataset.set;const v=+el.value;if(isNaN(v)||el.value===''){el.value=state.settings[k];return;}state.settings[k]=v;save();toast('保存しました');}
});
sheet.addEventListener('click',e=>{if(e.target===sheet)closeSheet();});
document.addEventListener('pointermove',e=>{const r=e.target.closest&&e.target.closest('rect.hit');if(r)chartHover(r,e);});
document.addEventListener('pointerdown',e=>{const r=e.target.closest&&e.target.closest('rect.hit');if(r)chartHover(r,e);});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&!sheet.hidden)closeSheet();});

render();
fetch('data/market.json',{cache:'no-store'}).then(r=>r.ok?r.json():null).then(j=>{if(j&&j.items){MKT=j;render();}}).catch(()=>{});
})();
</script>
