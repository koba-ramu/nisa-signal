# 毎朝7時30分(日本時間)に株価・財務データを取得し、data/market.json を更新する
name: 株価データの取得

on:
  schedule:
    # cron は世界標準時(UTC)。22:30 UTC = 翌朝7:30 JST。日〜金(UTC)= 月〜土の朝(JST)
    - cron: "30 22 * * 0-5"
  workflow_dispatch: {}   # GitHub の画面から手動でも実行できる

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python scripts/fetch_data.py
      - name: 変更があれば保存する
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898333+github-actions[bot]@users.noreply.github.com"
          git add data/market.json
          git diff --staged --quiet || git commit -m "株価データ更新 $(TZ=Asia/Tokyo date +%F)"
          git push
