# 毎朝7時30分(日本時間)に株価・財務データを取得し、Gemini で市況を判定して、data/ を更新する
name: 株価データの取得

on:
  schedule:
    # cron は世界標準時(UTC)。22:30 UTC = 翌朝7:30 JST。日〜金(UTC)= 月〜土の朝(JST)
    - cron: "30 22 * * 0-5"
  workflow_dispatch: {}   # GitHub の画面から手動でも実行できる

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: 株価・財務データの取得
        run: python scripts/fetch_data.py
      - name: Gemini による市況判定と通知
        run: python scripts/ai_market.py
        continue-on-error: true   # AIが失敗しても、株価データは保存する
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          APP_URL: ${{ vars.APP_URL }}
      - name: 変更があれば保存する
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898333+github-actions[bot]@users.noreply.github.com"
          git add data/
          git diff --staged --quiet || git commit -m "株価データ更新 $(TZ=Asia/Tokyo date +%F)"
          git push
